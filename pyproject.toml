[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reqhq"
version = "0.1.0"
description = "reqhq v2 — Local-first, hardware-adaptive agentic specification refinement engine (preserving legacy specpipe)"
readme = "README.md"
requires-python = ">=3.11"
# Verified on Python 3.15.0 (Windows) with --only-binary=:all:
dependencies = [
    "pydantic>=2.10",
    "typer>=0.15",
    "httpx>=0.27",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "msal>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]
# Optional high-speed PDF parser (cp310-abi3 wheel available on Python 3.15)
pdf-fast = [
    "pymupdf>=1.25",
]
# Unavailable on Python 3.15 due to upstream wheel/dependency constraints (see ADR-0004)
docling = [
    'docling>=2.0; python_version < "3.14"',
]
# Legacy specpipe v1 Streamlit UI dependencies
legacy = [
    "streamlit>=1.38",
    "requests>=2.31",
]

[project.scripts]
reqhq = "reqhq.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["reqhq*", "specpipe*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "alloy_live: opt-in test requiring Java and REQHQ_ALLOY_JAR_PATH",
]
